<!doctype html>
<html lang="en" data-theme="dark" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Verify code | ILE Lagos Chophouse</title>
    <meta name="robots" content="noindex" />
    <script>
      window.ILE_ROOT = '../';
    </script>
    <script src="../js/main.js"></script>
    <script src="../js/demo-store.js"></script>
    <script>
      document.documentElement.dataset.theme = 'dark';
    </script>
    <!-- auth is always dark; saved theme is not changed -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Marcellus&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="icon" href="../assets/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#171411" />
    <!-- favicon: replace the files in assets/icons/ to change it -->
  </head>
  <body class="auth">
    <a class="skip" href="#main">Skip to content</a>
    <div id="preloader">
      <img
        class="pl-logo"
        src="../assets/images/branding/logo-stacked-dark.png"
        alt="ILE Lagos Chophouse"
        width="640"
        height="491"
      />
      <div style="color: #c9bcae">Bold Flavours. Unforgettable Dining.</div>
      <div class="pl-bar"><i></i></div>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <div class="galaxy" aria-hidden="true"><div class="moon"></div></div>
    <main id="main" class="auth-wrap">
      <div class="container" style="max-width: 460px">
        <div class="text-center mb-3">
          <a class="brand-img" href="../index.html" aria-label="ILE Lagos Chophouse, home"
            ><img
              src="../assets/images/branding/logo-lockup-dark.png"
              alt="ILE Lagos Chophouse"
              width="568"
              height="140"
          /></a>
        </div>
        <div class="glass">
          <h1 class="h3">Enter your code</h1>
          <p class="muted">Type the 6-digit code from your email.</p>
          <form data-endpoint="auth/customer/verify-otp.php" data-next="reset-password.html">
            <div class="otp mb-3" role="group" aria-label="6-digit code">
              <input
                class="form-control"
                inputmode="numeric"
                maxlength="1"
                aria-label="Digit 1"
                autocomplete="one-time-code"
              /><input
                class="form-control"
                inputmode="numeric"
                maxlength="1"
                aria-label="Digit 2"
                autocomplete="one-time-code"
              /><input
                class="form-control"
                inputmode="numeric"
                maxlength="1"
                aria-label="Digit 3"
                autocomplete="one-time-code"
              /><input
                class="form-control"
                inputmode="numeric"
                maxlength="1"
                aria-label="Digit 4"
                autocomplete="one-time-code"
              /><input
                class="form-control"
                inputmode="numeric"
                maxlength="1"
                aria-label="Digit 5"
                autocomplete="one-time-code"
              /><input
                class="form-control"
                inputmode="numeric"
                maxlength="1"
                aria-label="Digit 6"
                autocomplete="one-time-code"
              />
            </div>
            <input type="hidden" id="otpValue" name="otp" required minlength="6" /><button
              class="btn btn-ile w-100 mt-2"
              type="submit"
            >
              Verify</button
            ><button
              type="button"
              class="btn btn-link w-100 mt-2"
              id="resend"
              data-endpoint="auth/customer/forgot-password.php"
            >
              Resend code
            </button>
          </form>
          <p class="small mt-3 mb-0 text-center"><a href="login.html">Back to login</a></p>
        </div>
      </div>
    </main>
    <script src="../js/form-validation.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>

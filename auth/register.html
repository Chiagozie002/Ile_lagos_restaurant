<!doctype html>
<html lang="en" data-theme="dark" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register | ILE Lagos Chophouse</title>
    <meta name="robots" content="noindex" />
    <script>
      window.ILE_ROOT = '../';
    </script>
    <script src="../js/main.js"></script>
    <script src="../js/demo-store.js"></script>
    <script>
      document.documentElement.dataset.theme = 'dark';
    </script>
    <!-- auth is always dark; saved theme is not changed -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Marcellus&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="icon" href="../assets/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#171411" />
    <!-- favicon: replace the files in assets/icons/ to change it -->
  </head>
  <body class="auth">
    <a class="skip" href="#main">Skip to content</a>
    <div id="preloader">
      <img
        class="pl-logo"
        src="../assets/images/branding/logo-stacked-dark.png"
        alt="ILE Lagos Chophouse"
        width="640"
        height="491"
      />
      <div style="color: #c9bcae">Bold Flavours. Unforgettable Dining.</div>
      <div class="pl-bar"><i></i></div>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <div class="galaxy" aria-hidden="true"><div class="moon"></div></div>
    <main id="main" class="auth-wrap">
      <div class="container">
        <div class="row g-4 align-items-center">
          <div class="col-lg-6 d-none d-md-block">
            <a class="brand-img" href="../index.html" aria-label="ILE Lagos Chophouse, home"
              ><img
                src="../assets/images/branding/logo-lockup-dark.png"
                alt="ILE Lagos Chophouse"
                width="568"
                height="140"
            /></a>
            <h1 class="mt-4" style="font-size: clamp(2rem, 1.3rem + 3vw, 3.4rem)">
              Bold Flavours. Unforgettable Dining.
            </h1>
            <p class="muted">Sign in to request tables and track your reservations.</p>
          </div>
          <div class="col-md-8 col-lg-5 mx-auto">
            <div class="glass">
              <a
                class="brand-img d-md-none d-block mb-3"
                href="../index.html"
                aria-label="ILE Lagos Chophouse, home"
                ><img
                  src="../assets/images/branding/logo-lockup-dark.png"
                  alt="ILE Lagos Chophouse"
                  width="568"
                  height="140"
              /></a>
              <h2 class="h3">Create your account</h2>
              <p class="muted">Takes a minute.</p>
              <form data-endpoint="auth/customer/register.php" data-next="verify-otp.html">
                <div class="mb-3">
                  <label class="form-label" for="name">Full name</label
                  ><input
                    class="form-control"
                    type="text"
                    id="name"
                    name="name"
                    required
                    autocomplete="name"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="email">Email</label
                  ><input
                    class="form-control"
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="phone">Phone</label
                  ><input
                    class="form-control"
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                    autocomplete="tel"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="password">Password</label>
                  <div class="pw">
                    <input
                      class="form-control"
                      type="password"
                      id="password"
                      name="password"
                      required
                      minlength="8"
                      autocomplete="new-password"
                    /><button type="button" aria-label="Show password">
                      <i class="fa-solid fa-eye"></i>
                    </button>
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="confirm">Confirm password</label
                  ><input
                    class="form-control"
                    type="password"
                    id="confirm"
                    name="confirm"
                    required
                    autocomplete="new-password"
                  />
                </div>
                <button class="btn btn-ile w-100 mt-2" type="submit">Create account</button>
              </form>
              <p class="small mt-3 mb-0">Already registered? <a href="login.html">Log in</a></p>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="../js/form-validation.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>

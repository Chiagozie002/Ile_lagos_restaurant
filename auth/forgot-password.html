    />

  <body class="auth">
    <a class="skip" href="#main">Skip to content</a>
    <div id="preloader">
      <div class="brand">ILE <b>Lagos</b> Chophouse</div>
      <div style="color: #c9bcae">Bold Flavours. Unforgettable Dining.</div>
      <div class="pl-bar"><i></i></div>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <div class="galaxy" aria-hidden="true"><div class="moon"></div></div>
    <main id="main" class="auth-wrap">
      <div class="container" style="max-width: 460px">
        <div class="text-center mb-3">
          <a class="brand" href="../index.html"
            >ILE <b style="color: #ff7900; font-weight: 400">Lagos</b> Chophouse</a
          >
        </div>
        <div class="glass">
          <h1 class="h3">Forgot password</h1>
          <p class="muted">Enter your email. If an account exists, we will send a code.</p>
          <form data-endpoint="auth/customer/forgot-password.php" data-next="verify-otp.html">
            <div class="mb-3">
              <label class="form-label" for="email">Email</label
              ><input
                class="form-control"
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
              />
            </div>
            <button class="btn btn-ile w-100 mt-2" type="submit">Send code</button>
          </form>
          <p class="small mt-3 mb-0 text-center"><a href="login.html">Back to login</a></p>
        </div>
      </div>
    </main>
    <script src="../js/form-validation.js"></script>
    <script src="../js/auth.js"></script>
  </body>
